site_name: helm-mutation-test
site_description: Mutation testing for Helm charts — measures how much your helm-unittest suites actually assert.
site_url: https://mmpyro.github.io/helm-mutation-test/
repo_url: https://github.com/mmpyro/helm-mutation-test
repo_name: mmpyro/helm-mutation-test
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed

docs_dir: docs
exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - CLI reference: cli-reference.md
  - Mutators: mutators.md
  - Reports: reports.md
  - Decisions:
      - "ADR-0001: Framework architecture": adr/0001-helm-mutation-test-framework.md
      - "ADR-0002: Equivalent-mutant detection": adr/0002-equivalent-mutant-detection.md
      - "ADR-0003: range-empty mutator": adr/0003-range-empty-mutator.md
      - "ADR-0004: Incremental mode": adr/0004-incremental-mode.md

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # GitHub-style anchors, so `#…` links work on github.com and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
