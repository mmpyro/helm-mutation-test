name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      # The tool measured against its own fixture chart, end to end through the
      # real CLI: exit codes, every report format, and the weak/strong score
      # expectations. If a mutator regresses, this is what catches it.
      - name: Integration tests
        run: make integration-tests

      # Not a check: the following steps publish this directory, and the weak and
      # strong score expectations are asserted by the integration suite above.
      - name: Generate the report for publishing
        run: |
          bin/helm-mutation-test -f 'tests/strong_test.yaml' testdata/charts/sample \
            --threshold 70 --report console,markdown,json --report-dir mutation-strong

      - name: Publish the mutation report to the job summary
        if: always()
        run: cat mutation-strong/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-strong/
