apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
data:
  static: "always"
  {{- range .Values.ports }}
  port-{{ . }}: "open"
  {{- end }}
  {{- range $k, $v := .Values.labels }}
  label-{{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range .Values.extras }}
  extra-{{ . }}: "yes"
  {{- end }}
  {{- range $k, $v := .Values.extraLabels }}
  extra-label-{{ $k }}: {{ $v | quote }}
  {{- end }}
